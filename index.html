<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loan — Réalisateur YouTube</title>
<meta name="description" content="Loan, réalisateur et créateur YouTube.">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap');

  :root {
    --yt-glow: rgba(255, 0, 51, 0.45);
    --ig-glow: rgba(255, 60, 172, 0.45);
    --tt-glow: rgba(255, 255, 255, 0.35);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Poppins', sans-serif;
    min-height: 100vh;
    background: linear-gradient(160deg, #1a0533 0%, #0d1b4b 50%, #000000 100%);
    background-attachment: fixed;
    color: #f5f5fa;
    display: flex;
    justify-content: center;
    padding: 56px 20px 40px;
    position: relative;
    overflow-x: hidden;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
      radial-gradient(circle at 20% 15%, rgba(140, 70, 255, 0.20), transparent 45%),
      radial-gradient(circle at 80% 75%, rgba(30, 90, 255, 0.18), transparent 45%);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    z-index: 1;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(18px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .fade-in {
    opacity: 0;
    animation: fadeUp 0.7s ease forwards;
  }

  .avatar {
    width: 128px;
    height: 128px;
    border-radius: 50%;
    background: linear-gradient(135deg, #8b5cf6, #3b82f6);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 52px;
    font-weight: 700;
    color: #fff;
    box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.08), 0 8px 32px rgba(90, 50, 200, 0.5);
    animation-delay: 0.05s;
  }

  h1 {
    margin-top: 22px;
    font-size: 32px;
    font-weight: 700;
    letter-spacing: 0.5px;
    animation-delay: 0.15s;
  }

  .subtitle {
    margin-top: 6px;
    font-size: 15px;
    font-weight: 400;
    color: rgba(245, 245, 250, 0.65);
    letter-spacing: 0.3px;
    animation-delay: 0.22s;
  }

  .tagline {
    margin-top: 14px;
    font-size: 14.5px;
    font-weight: 300;
    color: rgba(245, 245, 250, 0.8);
    text-align: center;
    animation-delay: 0.3s;
  }

  .links {
    width: 100%;
    margin-top: 32px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .link-card {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    padding: 16px 20px;
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.06);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255, 255, 255, 0.12);
    text-decoration: none;
    color: #fff;
    font-weight: 500;
    font-size: 16px;
    transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease, background 0.25s ease;
    animation-delay: 0.38s;
  }

  .link-card svg { flex-shrink: 0; width: 24px; height: 24px; }

  .link-card:hover {
    transform: translateY(-4px);
    background: rgba(255, 255, 255, 0.09);
  }

  .link-card.youtube:hover { box-shadow: 0 10px 30px var(--yt-glow); border-color: rgba(255, 0, 51, 0.5); }
  .link-card.instagram:hover { box-shadow: 0 10px 30px var(--ig-glow); border-color: rgba(255, 60, 172, 0.5); }
  .link-card.tiktok:hover { box-shadow: 0 10px 30px var(--tt-glow); border-color: rgba(255, 255, 255, 0.5); }

  .links .link-card:nth-child(1) { animation-delay: 0.38s; }
  .links .link-card:nth-child(2) { animation-delay: 0.46s; }
  .links .link-card:nth-child(3) { animation-delay: 0.54s; }

  .videos-section {
    width: 100%;
    margin-top: 44px;
    animation-delay: 0.62s;
  }

  .videos-section h2 {
    font-size: 17px;
    font-weight: 600;
    margin-bottom: 16px;
    color: rgba(245, 245, 250, 0.9);
  }

  .video-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }

  .video-card {
    text-decoration: none;
    color: #fff;
    display: block;
    border-radius: 14px;
    overflow: hidden;
    background: rgba(255, 255, 255, 0.06);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }

  .video-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 10px 26px var(--yt-glow);
  }

  .thumb {
    width: 100%;
    aspect-ratio: 16 / 9;
    background: linear-gradient(135deg, rgba(140, 70, 255, 0.4), rgba(30, 40, 90, 0.6));
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .thumb svg { width: 34px; height: 34px; opacity: 0.85; }

  .video-title {
    padding: 10px 12px 13px;
    font-size: 13px;
    font-weight: 400;
    color: rgba(245, 245, 250, 0.85);
    line-height: 1.3;
  }

  footer {
    margin-top: 50px;
    font-size: 12.5px;
    font-weight: 300;
    color: rgba(245, 245, 250, 0.4);
    animation-delay: 0.75s;
  }

  @media (max-width: 380px) {
    .avatar { width: 108px; height: 108px; font-size: 44px; }
    h1 { font-size: 28px; }
    .link-card { padding: 14px 16px; font-size: 15px; }
  }
</style>
</head>
<body>
  <div class="container">

    <div class="avatar fade-in">L</div>

    <h1 class="fade-in">Loan</h1>
    <p class="subtitle fade-in">Réalisateur · YouTube</p>
    <p class="tagline fade-in">Je transforme des idées en films.</p>

    <div class="links">
      <a class="link-card youtube fade-in" href="https://youtube.com/@Loaaannn" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="#ff0033"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.4 3.5 12 3.5 12 3.5s-7.4 0-9.4.6A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c2 .6 9.4.6 9.4.6s7.4 0 9.4-.6a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8ZM9.6 15.6V8.4l6.3 3.6-6.3 3.6Z"/></svg>
        YouTube
      </a>
      <a class="link-card instagram fade-in" href="https://instagram.com/Loan_yt" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="#ff3cac" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r="1.1" fill="#ff3cac" stroke="none"/></svg>
        Instagram
      </a>
      <a class="link-card tiktok fade-in" href="#" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="#ffffff"><path d="M16.6 3h-3.2v13a2.7 2.7 0 1 1-2.1-2.6v-3.2a5.9 5.9 0 1 0 5.3 5.9V9.6a7.2 7.2 0 0 0 4.4 1.5V8a4 4 0 0 1-4.4-5Z"/></svg>
        TikTok
      </a>
    </div>

    <div class="videos-section fade-in">
      <h2>Dernières vidéos</h2>
      <div class="video-grid">
        <a class="video-card" href="https://youtube.com/@Loaaannn" target="_blank" rel="noopener">
          <div class="thumb">
            <svg viewBox="0 0 24 24" fill="#ffffffcc"><path d="M8 5v14l11-7z"/></svg>
          </div>
          <p class="video-title">Nouvelle vidéo bientôt disponible</p>
        </a>
        <a class="video-card" href="https://youtube.com/@Loaaannn" target="_blank" rel="noopener">
          <div class="thumb">
            <svg viewBox="0 0 24 24" fill="#ffffffcc"><path d="M8 5v14l11-7z"/></svg>
          </div>
          <p class="video-title">Nouvelle vidéo bientôt disponible</p>
        </a>
      </div>
    </div>

    <footer class="fade-in">© 2026 Loan</footer>

  </div>
</body>
</html>
