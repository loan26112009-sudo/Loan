<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loan — Réalisateur YouTube</title>
<meta name="description" content="Loan, réalisateur et créateur YouTube. Retrouve mes vidéos et réseaux sociaux.">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');

  :root {
    --sky: #4fc3ff;
    --bg: #0a0a0a;
    --card: #141414;
    --card-hover: #1a1a1a;
    --card-border: rgba(255, 255, 255, 0.08);
    --text-dim: rgba(245, 245, 250, 0.62);
    --text-faint: rgba(245, 245, 250, 0.4);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; background: var(--bg); }

  body {
    font-family: 'Poppins', sans-serif;
    min-height: 100vh;
    background: var(--bg);
    color: #f5f5fa;
    display: flex;
    justify-content: center;
    padding: 40px 16px 60px;
  }

  .page {
    width: 100%;
    max-width: 900px;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .tile {
    opacity: 0;
    animation: fadeUp 0.55s ease forwards;
  }

  /* --- Bento grid --- */
  .bento {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-auto-rows: 132px;
    grid-auto-flow: dense;
    gap: 14px;
  }

  .tile {
    border-radius: 22px;
    background: var(--card);
    border: 1px solid var(--card-border);
    overflow: hidden;
    position: relative;
    display: flex;
    box-shadow: 0 1px 0 rgba(255, 255, 255, 0.03) inset;
    transition: transform 0.22s ease, border-color 0.22s ease, background 0.22s ease, box-shadow 0.22s ease;
  }

  /* Accessible keyboard focus, visible on every interactive tile */
  a.tile:focus-visible {
    outline: 2px solid var(--sky);
    outline-offset: 3px;
  }

  /* --- Profile card --- */
  .t-profile {
    grid-column: span 2;
    grid-row: span 2;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 10px;
    padding: 20px;
    animation-delay: 0.02s;
  }

  .avatar-photo {
    width: 88px;
    height: 88px;
    border-radius: 50%;
    background: linear-gradient(150deg, rgba(79, 195, 255, 0.3), rgba(20, 20, 20, 0.6));
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid rgba(79, 195, 255, 0.4);
    box-shadow: 0 0 0 4px rgba(79, 195, 255, 0.08);
  }

  .avatar-photo svg { width: 30px; height: 30px; opacity: 0.55; }

  .t-profile h1 {
    font-size: 25px;
    font-weight: 800;
    color: var(--sky);
    letter-spacing: 0.3px;
  }

  .t-profile .subtitle {
    font-size: 12.5px;
    color: var(--text-dim);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.6px;
  }

  .t-profile .tagline {
    font-size: 12.5px;
    color: rgba(245, 245, 250, 0.78);
    font-weight: 400;
    max-width: 210px;
    line-height: 1.45;
  }

  /* --- Link tiles: icon badge + name + handle, for clear, accessible targets --- */
  .t-link {
    align-items: center;
    gap: 12px;
    padding: 0 18px;
    font-weight: 600;
    color: #fff;
    text-decoration: none;
  }

  .link-badge {
    flex-shrink: 0;
    width: 42px;
    height: 42px;
    border-radius: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .link-badge svg { width: 22px; height: 22px; }

  .link-badge.yt { background: #ff0033; }
  .link-badge.ig { background: linear-gradient(140deg, #fdc468 0%, #e1306c 45%, #833ab4 100%); }
  .link-badge.tt { background: #ffffff; }

  .link-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .link-text strong { font-size: 15.5px; font-weight: 700; }
  .link-text small { font-size: 12px; font-weight: 500; color: var(--text-dim); }

  .t-link .go-arrow {
    margin-left: auto;
    width: 16px;
    height: 16px;
    opacity: 0;
    transform: translateX(-4px);
    transition: opacity 0.22s ease, transform 0.22s ease;
    flex-shrink: 0;
  }

  .t-link:hover,
  .t-link:focus-visible {
    transform: translateY(-3px);
    background: var(--card-hover);
    border-color: rgba(255, 255, 255, 0.18);
  }

  .t-link:hover .go-arrow,
  .t-link:focus-visible .go-arrow { opacity: 0.6; transform: translateX(0); }

  .t-youtube:hover, .t-youtube:focus-visible { border-color: rgba(255, 0, 51, 0.5); box-shadow: 0 8px 24px rgba(255, 0, 51, 0.18); }
  .t-instagram:hover, .t-instagram:focus-visible { border-color: rgba(225, 48, 108, 0.5); box-shadow: 0 8px 24px rgba(225, 48, 108, 0.16); }
  .t-tiktok:hover, .t-tiktok:focus-visible { border-color: rgba(255, 255, 255, 0.35); box-shadow: 0 8px 24px rgba(255, 255, 255, 0.1); }

  .t-youtube { grid-column: span 2; grid-row: span 1; animation-delay: 0.08s; }
  .t-instagram { grid-column: span 1; grid-row: span 1; animation-delay: 0.14s; }
  .t-tiktok { grid-column: span 1; grid-row: span 1; animation-delay: 0.2s; }

  /* Stacked layout for the two narrower link tiles */
  .t-instagram, .t-tiktok {
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    gap: 8px;
    padding: 14px 10px;
  }

  .t-instagram .link-text, .t-tiktok .link-text { align-items: center; }
  .t-instagram .go-arrow, .t-tiktok .go-arrow { display: none; }

  /* --- Photo tiles --- */
  .t-photo {
    align-items: center;
    justify-content: center;
    text-align: center;
    color: var(--text-dim);
    text-decoration: none;
  }

  .t-photo .photo-fill {
    position: absolute;
    inset: 0;
    background:
      linear-gradient(150deg, rgba(79, 195, 255, 0.16), rgba(15, 15, 15, 0.45)),
      repeating-linear-gradient(45deg, rgba(255,255,255,0.028) 0 2px, transparent 2px 14px);
  }

  .t-photo .slot-label {
    position: relative;
    z-index: 1;
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 0 10px;
  }

  .t-photo .slot-label svg { width: 20px; height: 20px; opacity: 0.55; }

  .t-photo:hover, .t-photo:focus-visible { transform: translateY(-3px); border-color: rgba(79, 195, 255, 0.35); }

  .t-photo-1 { grid-column: span 1; grid-row: span 2; animation-delay: 0.1s; }
  .t-photo-2 { grid-column: span 2; grid-row: span 1; animation-delay: 0.26s; }
  .t-photo-3 { grid-column: span 1; grid-row: span 1; animation-delay: 0.32s; }
  .t-photo-4 { grid-column: span 2; grid-row: span 1; animation-delay: 0.38s; }
  .t-photo-5 { grid-column: span 2; grid-row: span 1; animation-delay: 0.44s; }

  footer {
    margin-top: 28px;
    text-align: center;
    font-size: 12px;
    font-weight: 400;
    color: var(--text-faint);
  }

  /* --- Scroll to top button --- */
  .scroll-top {
    position: fixed;
    right: 20px;
    bottom: 20px;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: var(--sky);
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    box-shadow: 0 6px 20px rgba(79, 195, 255, 0.35);
    transition: transform 0.2s ease;
  }

  .scroll-top:hover, .scroll-top:focus-visible { transform: translateY(-3px); }
  .scroll-top:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  .scroll-top svg { width: 20px; height: 20px; stroke: #06121a; }

  /* --- Mobile: 2-column bento --- */
  @media (max-width: 700px) {
    .bento {
      grid-template-columns: repeat(2, 1fr);
      grid-auto-rows: 128px;
    }

    .t-profile { grid-column: span 2; grid-row: span 2; }
    .t-youtube { grid-column: span 2; }
    .t-instagram { grid-column: span 1; }
    .t-tiktok { grid-column: span 1; }
    .t-photo-1 { grid-column: span 1; grid-row: span 2; }
    .t-photo-2 { grid-column: span 1; grid-row: span 2; }
    .t-photo-3 { grid-column: span 2; grid-row: span 1; }
    .t-photo-4 { grid-column: span 2; grid-row: span 1; }
    .t-photo-5 { grid-column: span 2; grid-row: span 1; }
  }

  @media (max-width: 380px) {
    .avatar-photo { width: 76px; height: 76px; }
    .t-profile h1 { font-size: 22px; }
  }
</style>
</head>
