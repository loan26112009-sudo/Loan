<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loan — Réalisateur YouTube</title>
<meta name="description" content="Loan, réalisateur et créateur YouTube.">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');

  :root {
    --sky: #4fc3ff;
    --bg: #0a0a0a;
    --card: #141414;
    --card-border: rgba(255, 255, 255, 0.07);
    --text-dim: rgba(245, 245, 250, 0.55);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; background: var(--bg); }

  body {
    font-family: 'Poppins', sans-serif;
    min-height: 100vh;
    background: var(--bg);
    color: #f5f5fa;
    display: flex;
    justify-content: center;
    padding: 40px 16px 60px;
  }

  .page {
    width: 100%;
    max-width: 900px;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .tile {
    opacity: 0;
    animation: fadeUp 0.55s ease forwards;
  }

  /* --- Bento grid --- */
  .bento {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-auto-rows: 130px;
    grid-auto-flow: dense;
    gap: 14px;
  }

  .tile {
    border-radius: 20px;
    background: var(--card);
    border: 1px solid var(--card-border);
    overflow: hidden;
    position: relative;
    display: flex;
    transition: transform 0.25s ease, border-color 0.25s ease, background 0.25s ease;
  }

  /* --- Profile card --- */
  .t-profile {
    grid-column: span 2;
    grid-row: span 2;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 10px;
    padding: 20px;
    animation-delay: 0.02s;
  }

  .avatar-photo {
    width: 84px;
    height: 84px;
    border-radius: 50%;
    background: linear-gradient(150deg, rgba(79, 195, 255, 0.28), rgba(20, 20, 20, 0.6));
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid rgba(255, 255, 255, 0.1);
  }

  .avatar-photo svg { width: 30px; height: 30px; opacity: 0.55; }

  .t-profile h1 {
    font-size: 24px;
    font-weight: 800;
    color: var(--sky);
    letter-spacing: 0.3px;
  }

  .t-profile .subtitle {
    font-size: 12.5px;
    color: var(--text-dim);
    font-weight: 500;
  }

  .t-profile .tagline {
    font-size: 12px;
    color: rgba(245, 245, 250, 0.7);
    font-weight: 400;
    max-width: 200px;
    line-height: 1.4;
  }

  /* --- Link tiles --- */
  .t-link {
    align-items: center;
    justify-content: center;
    gap: 10px;
    font-weight: 600;
    font-size: 15px;
    color: #fff;
    text-decoration: none;
  }

  .t-link svg { width: 22px; height: 22px; flex-shrink: 0; }

  .t-link:hover { transform: translateY(-3px); border-color: rgba(255, 255, 255, 0.2); background: #191919; }

  .t-youtube { grid-column: span 2; grid-row: span 1; animation-delay: 0.08s; }
  .t-instagram { grid-column: span 1; grid-row: span 1; animation-delay: 0.14s; }
  .t-tiktok { grid-column: span 1; grid-row: span 1; animation-delay: 0.2s; }

  /* --- Photo tiles --- */
  .t-photo {
    align-items: center;
    justify-content: center;
    text-align: center;
    color: var(--text-dim);
  }

  .t-photo .photo-fill {
    position: absolute;
    inset: 0;
    background:
      linear-gradient(150deg, rgba(79, 195, 255, 0.14), rgba(15, 15, 15, 0.4)),
      repeating-linear-gradient(45deg, rgba(255,255,255,0.025) 0 2px, transparent 2px 14px);
  }

  .t-photo .slot-label {
    position: relative;
    z-index: 1;
    font-size: 10.5px;
    font-weight: 500;
    letter-spacing: 1px;
    text-transform: uppercase;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 0 10px;
  }

  .t-photo .slot-label svg { width: 20px; height: 20px; opacity: 0.5; }

  .t-photo:hover { transform: translateY(-3px); }

  .t-photo-1 { grid-column: span 1; grid-row: span 2; animation-delay: 0.1s; }
  .t-photo-2 { grid-column: span 2; grid-row: span 1; animation-delay: 0.26s; }
  .t-photo-3 { grid-column: span 1; grid-row: span 1; animation-delay: 0.32s; }
  .t-photo-4 { grid-column: span 2; grid-row: span 1; animation-delay: 0.38s; }
  .t-photo-5 { grid-column: span 2; grid-row: span 1; animation-delay: 0.44s; }

  footer {
    margin-top: 28px;
    text-align: center;
    font-size: 12px;
    font-weight: 400;
    color: rgba(245, 245, 250, 0.35);
  }

  /* --- Scroll to top button --- */
  .scroll-top {
    position: fixed;
    right: 20px;
    bottom: 20px;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: var(--sky);
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    box-shadow: 0 6px 20px rgba(79, 195, 255, 0.35);
    transition: transform 0.2s ease;
  }

  .scroll-top:hover { transform: translateY(-3px); }
  .scroll-top svg { width: 20px; height: 20px; stroke: #06121a; }

  /* --- Mobile: 2-column bento --- */
  @media (max-width: 700px) {
    .bento {
      grid-template-columns: repeat(2, 1fr);
      grid-auto-rows: 130px;
    }

    .t-profile { grid-column: span 2; grid-row: span 2; }
    .t-youtube { grid-column: span 2; }
    .t-instagram { grid-column: span 1; }
    .t-tiktok { grid-column: span 1; }
    .t-photo-1 { grid-column: span 1; grid-row: span 2; }
    .t-photo-2 { grid-column: span 1; grid-row: span 2; }
    .t-photo-3 { grid-column: span 2; grid-row: span 1; }
    .t-photo-4 { grid-column: span 2; grid-row: span 1; }
    .t-photo-5 { grid-column: span 2; grid-row: span 1; }
  }

  @media (max-width: 380px) {
    .avatar-photo { width: 72px; height: 72px; }
    .t-profile h1 { font-size: 21px; }
  }
</style>
</head>
