<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loan — Réalisateur YouTube</title>
<meta name="description" content="Loan, réalisateur et créateur YouTube.">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap');

  :root {
    --yt-glow: rgba(255, 0, 51, 0.45);
    --ig-glow: rgba(255, 60, 172, 0.45);
    --tt-glow: rgba(255, 255, 255, 0.35);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Poppins', sans-serif;
    min-height: 100vh;
    background: linear-gradient(160deg, #1a0533 0%, #0d1b4b 50%, #000000 100%);
    background-attachment: fixed;
    color: #f5f5fa;
    display: flex;
    justify-content: center;
    padding: 0 0 40px;
    position: relative;
    overflow-x: hidden;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
      radial-gradient(circle at 20% 15%, rgba(140, 70, 255, 0.20), transparent 45%),
      radial-gradient(circle at 80% 75%, rgba(30, 90, 255, 0.18), transparent 45%);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    width: 100%;
    max-width: 520px;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    z-index: 1;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(18px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .fade-in {
    opacity: 0;
    animation: fadeUp 0.7s ease forwards;
  }

  /* --- Photo placeholder base --- */
  .photo-slot {
    background:
      linear-gradient(150deg, rgba(140, 90, 255, 0.35), rgba(20, 30, 70, 0.55)),
      repeating-linear-gradient(45deg, rgba(255,255,255,0.035) 0 2px, transparent 2px 14px);
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(245, 245, 250, 0.55);
    text-align: center;
    position: relative;
  }

  .photo-slot .slot-label {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }

  .photo-slot .slot-label svg { width: 22px; height: 22px; opacity: 0.6; }

  /* --- Banner / cover photo --- */
  .banner {
    width: 100%;
    aspect-ratio: 16 / 7;
    max-height: 260px;
    border-radius: 0 0 28px 28px;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
    animation-delay: 0.02s;
  }

  .profile-area {
    width: 100%;
    max-width: 480px;
    padding: 0 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* --- Avatar photo (overlaps banner) --- */
  .avatar {
    width: 128px;
    height: 128px;
    border-radius: 50%;
    margin-top: -64px;
    box-shadow: 0 0 0 5px #0d1230, 0 8px 32px rgba(90, 50, 200, 0.5);
    animation-delay: 0.1s;
  }

  h1 {
    margin-top: 18px;
    font-size: 32px;
    font-weight: 700;
    letter-spacing: 0.5px;
    animation-delay: 0.18s;
  }

  .subtitle {
    margin-top: 6px;
    font-size: 15px;
    font-weight: 400;
    color: rgba(245, 245, 250, 0.65);
    letter-spacing: 0.3px;
    animation-delay: 0.24s;
  }

  .tagline {
    margin-top: 14px;
    font-size: 14.5px;
    font-weight: 300;
    color: rgba(245, 245, 250, 0.8);
    text-align: center;
    animation-delay: 0.3s;
  }

  .links {
    width: 100%;
    margin-top: 32px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .link-card {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    padding: 16px 20px;
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.06);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255, 255, 255, 0.12);
    text-decoration: none;
    color: #fff;
    font-weight: 500;
    font-size: 16px;
    transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease, background 0.25s ease;
  }

  .link-card svg { flex-shrink: 0; width: 24px; height: 24px; }

  .link-card:hover {
    transform: translateY(-4px);
    background: rgba(255, 255, 255, 0.09);
  }

  .link-card.youtube:hover { box-shadow: 0 10px 30px var(--yt-glow); border-color: rgba(255, 0, 51, 0.5); }
  .link-card.instagram:hover { box-shadow: 0 10px 30px var(--ig-glow); border-color: rgba(255, 60, 172, 0.5); }
  .link-card.tiktok:hover { box-shadow: 0 10px 30px var(--tt-glow); border-color: rgba(255, 255, 255, 0.5); }

  .links .link-card:nth-child(1) { animation-delay: 0.38s; }
  .links .link-card:nth-child(2) { animation-delay: 0.46s; }
  .links .link-card:nth-child(3) { animation-delay: 0.54s; }

  /* --- Gallery --- */
  .gallery-section {
    width: 100%;
    margin-top: 48px;
    animation-delay: 0.62s;
  }

  .gallery-section .section-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .gallery-section h2 {
    font-size: 18px;
    font-weight: 600;
    color: rgba(245, 245, 250, 0.92);
  }

  .gallery-section .see-more {
    font-size: 12.5px;
    font-weight: 400;
    color: rgba(245, 245, 250, 0.5);
    text-decoration: none;
  }

  .gallery-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .gallery-grid a.wide { grid-column: span 2; }

  .gallery-card {
    text-decoration: none;
    color: #fff;
    display: block;
    border-radius: 16px;
    overflow: hidden;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    position: relative;
  }

  .gallery-card .photo-slot {
    width: 100%;
    aspect-ratio: 4 / 5;
    transition: transform 0.5s ease;
  }

  .gallery-card.wide .photo-slot { aspect-ratio: 16 / 8; }

  .gallery-card:hover .photo-slot { transform: scale(1.06); }

  .gallery-card .overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0) 55%);
    display: flex;
    align-items: flex-end;
    padding: 12px;
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  .gallery-card:hover .overlay { opacity: 1; }

  .gallery-card .overlay span {
    font-size: 12.5px;
    font-weight: 500;
    line-height: 1.3;
  }

  footer {
    margin-top: 50px;
    font-size: 12.5px;
    font-weight: 300;
    color: rgba(245, 245, 250, 0.4);
    animation-delay: 0.8s;
  }

  @media (max-width: 380px) {
    .avatar { width: 104px; height: 104px; margin-top: -52px; }
    h1 { font-size: 28px; }
    .link-card { padding: 14px 16px; font-size: 15px; }
  }
</style>
</head>
<body>

</body>
</html>
