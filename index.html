<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loan — Réalisateur YouTube</title>
<meta name="description" content="Loan, réalisateur et créateur YouTube. Retrouve mes vidéos et réseaux sociaux.">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');

  :root {
    --sky: #4fc3ff;
    --bg: #0a0a0a;
    --card: #141414;
    --card-hover: #1a1a1a;
    --card-border: rgba(255, 255, 255, 0.08);
    --text-dim: rgba(245, 245, 250, 0.62);
    --text-faint: rgba(245, 245, 250, 0.4);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; background: var(--bg); }

  body {
    font-family: 'Poppins', sans-serif;
    min-height: 100vh;
    background: var(--bg);
    color: #f5f5fa;
    display: flex;
    justify-content: center;
    padding: 40px 16px 60px;
  }

  .page {
    width: 100%;
    max-width: 760px;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* --- Profile header (separate from the grid, full width) --- */
  .profile {
    opacity: 0;
    animation: fadeUp 0.55s ease forwards;
    border-radius: 22px;
    background: var(--card);
    border: 1px solid var(--card-border);
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 22px;
    margin-bottom: 14px;
  }

  .avatar-photo {
    width: 76px;
    height: 76px;
    flex-shrink: 0;
    border-radius: 50%;
    background: linear-gradient(150deg, rgba(79, 195, 255, 0.3), rgba(20, 20, 20, 0.6));
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid rgba(79, 195, 255, 0.4);
    box-shadow: 0 0 0 4px rgba(79, 195, 255, 0.08);
  }

  .avatar-photo svg { width: 28px; height: 28px; opacity: 0.55; }

  .profile-info { min-width: 0; }

  .profile-info h1 {
    font-size: 22px;
    font-weight: 800;
    color: var(--sky);
    letter-spacing: 0.3px;
  }

  .profile-info .subtitle {
    margin-top: 3px;
    font-size: 12px;
    color: var(--text-dim);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.6px;
  }

  .profile-info .tagline {
    margin-top: 8px;
    font-size: 13px;
    color: rgba(245, 245, 250, 0.78);
    font-weight: 400;
    line-height: 1.45;
  }

  /* --- Uniform grid: every tile is the exact same square shape --- */
  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
  }

  .tile {
    opacity: 0;
    animation: fadeUp 0.5s ease forwards;
    aspect-ratio: 1 / 1;
    border-radius: 20px;
    background: var(--card);
    border: 1px solid var(--card-border);
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 8px;
    padding: 10px;
    text-decoration: none;
    color: #fff;
    transition: transform 0.22s ease, border-color 0.22s ease, background 0.22s ease, box-shadow 0.22s ease;
  }

  .tile:nth-child(1) { animation-delay: 0.04s; }
  .tile:nth-child(2) { animation-delay: 0.08s; }
  .tile:nth-child(3) { animation-delay: 0.12s; }
  .tile:nth-child(4) { animation-delay: 0.16s; }
  .tile:nth-child(5) { animation-delay: 0.2s; }
  .tile:nth-child(6) { animation-delay: 0.24s; }
  .tile:nth-child(7) { animation-delay: 0.28s; }
  .tile:nth-child(8) { animation-delay: 0.32s; }

  a.tile:focus-visible {
    outline: 2px solid var(--sky);
    outline-offset: 3px;
  }

  a.tile:hover { transform: translateY(-3px); background: var(--card-hover); border-color: rgba(255, 255, 255, 0.18); }

  /* --- Link tiles --- */
  .link-badge {
    width: 38px;
    height: 38px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .link-badge svg { width: 20px; height: 20px; }

  .link-badge.yt { background: #ff0033; }
  .link-badge.ig { background: linear-gradient(140deg, #fdc468 0%, #e1306c 45%, #833ab4 100%); }
  .link-badge.tt { background: #ffffff; }

  .t-link strong { font-size: 14px; font-weight: 700; }
  .t-link small { font-size: 10.5px; font-weight: 500; color: var(--text-dim); }

  .t-youtube:hover { border-color: rgba(255, 0, 51, 0.5); box-shadow: 0 8px 24px rgba(255, 0, 51, 0.18); }
  .t-instagram:hover { border-color: rgba(225, 48, 108, 0.5); box-shadow: 0 8px 24px rgba(225, 48, 108, 0.16); }
  .t-tiktok:hover { border-color: rgba(255, 255, 255, 0.35); box-shadow: 0 8px 24px rgba(255, 255, 255, 0.1); }

  /* --- Photo tiles --- */
  .t-photo { color: var(--text-dim); }

  .t-photo .photo-fill {
    position: absolute;
    inset: 0;
    background:
      linear-gradient(150deg, rgba(79, 195, 255, 0.16), rgba(15, 15, 15, 0.45)),
      repeating-linear-gradient(45deg, rgba(255,255,255,0.028) 0 2px, transparent 2px 14px);
  }

  .t-photo .slot-label {
    position: relative;
    z-index: 1;
    font-size: 9.5px;
    font-weight: 600;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
  }

  .t-photo .slot-label svg { width: 18px; height: 18px; opacity: 0.55; }

  .t-photo:hover { border-color: rgba(79, 195, 255, 0.35); }

  footer {
    margin-top: 24px;
    text-align: center;
    font-size: 12px;
    font-weight: 400;
    color: var(--text-faint);
  }

  /* --- Scroll to top button --- */
  .scroll-top {
    position: fixed;
    right: 20px;
    bottom: 20px;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: var(--sky);
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    box-shadow: 0 6px 20px rgba(79, 195, 255, 0.35);
    transition: transform 0.2s ease;
  }

  .scroll-top:hover, .scroll-top:focus-visible { transform: translateY(-3px); }
  .scroll-top:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  .scroll-top svg { width: 20px; height: 20px; stroke: #06121a; }

  /* --- Mobile: still a uniform grid, just fewer columns --- */
  @media (max-width: 560px) {
    .grid { grid-template-columns: repeat(3, 1fr); }
    .profile { padding: 18px; gap: 14px; }
    .avatar-photo { width: 64px; height: 64px; }
    .profile-info h1 { font-size: 19px; }
  }

  @media (max-width: 400px) {
    .grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
